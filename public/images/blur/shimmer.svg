<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="g">
            <stop stop-color="#252740" offset="20%" />
            <stop stop-color="#080a20" offset="50%" />
            <stop stop-color="#252740" offset="70%" />
        </linearGradient>
    </defs>
    <rect width="100" height="100" fill="#252740" />
    <rect id="r" width="100" height="100" fill="url(#g)" />
    <animate xlink:href="#r" attributeName="x" from="-100" to="100" dur="1s" repeatCount="indefinite"  />
</svg>
