name: Production Maps smoke check

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Production Google Maps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browser
        run: yarn test:e2e:install

      - name: Check production Google Maps
        run: yarn test:e2e:maps-smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: production-maps-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
