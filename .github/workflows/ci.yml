name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate & build
    runs-on: ubuntu-latest
    # Next production builds do not load .env.test. These non-secret dummy
    # values keep next.config.js valid without exposing deployment credentials.
    env:
      CUSTOM_APP_DOMAIN: 'example.test'
      GMAIL_APP_EMAIL: 'owner@example.test'
      GMAIL_APP_PASSWORD: 'test-app-password'
      GMAIL_SENDER_EMAIL: 'owner@example.test'
      GOOGLE_MAPS_API_KEY: 'test-google-maps-api-key'
      GOOGLE_MAPS_MAP_ID: 'test-google-maps-map-id'
      HOST: 'http://localhost:3000'
      HOSTNAME: 'localhost:3000'
      IMAGE_HOST: 'https://res.cloudinary.com/henetiriki/image/upload/v1664623206/insta'
      IMAGE_HOST_NAME: 'res.cloudinary.com'
      IMAGE_HOST_PATH: 'henetiriki/image/upload/v1664623206/insta'
      IMAGE_HOST_PROTOCOL: 'https'
      ISTAGRAM_IMAGE_IDS: 'BZ4QGdOn6SP,Bcg0AZwFwv6,B5zAuLqJTEg,CEbEP7XJafW'
      PROTOCOL: 'https'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('next.config.js', 'postcss.config.cjs', 'tsconfig.json', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'service-worker/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check generated CSS variables
        run: yarn css-vars:check

      - name: Lint
        run: yarn eslint:check

      - name: Type-check application
        run: yarn type-check

      - name: Type-check service worker
        run: yarn tsc --pretty --noEmit --project service-worker/tsconfig.json

      - name: Check formatting
        run: yarn prettier:check

      - name: Test with coverage
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          use_oidc: true

      # One build, because there is only one production configuration: the
      # service worker is generated whenever NODE_ENV is production, with no
      # flag to set. See D004.
      - name: Build
        run: yarn build

      - name: Verify service worker output
        run: test -s public/sw.js

      # Keyed on the installed Playwright version, because that is what the
      # ~270 MB browser download actually tracks. A lockfile-wide key would
      # discard it on every weekly Dependabot bump. Install scripts are
      # disabled repository-wide (D008), so the browser is fetched explicitly
      # here rather than by a postinstall hook.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          path: ~/.cache/ms-playwright

      # Always run: --with-deps also installs system font and library packages,
      # which live outside the cached browser directory.
      - name: Install Playwright browser
        run: yarn test:e2e:install

      - name: Browser regression suite
        run: yarn test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
