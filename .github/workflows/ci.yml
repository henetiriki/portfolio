name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hoisted to workflow level so the two jobs below share one copy. The build
# needs all of it; Playwright's `webServer` starts `yarn start`, so the browser
# suite needs it too. Next production builds do not load .env.test — these
# non-secret dummy values keep next.config.js valid without exposing
# deployment credentials.
env:
  CUSTOM_APP_DOMAIN: 'example.test'
  GMAIL_APP_EMAIL: 'owner@example.test'
  GMAIL_APP_PASSWORD: 'test-app-password'
  GMAIL_SENDER_EMAIL: 'owner@example.test'
  GOOGLE_MAPS_API_KEY: 'test-google-maps-api-key'
  GOOGLE_MAPS_MAP_ID: 'test-google-maps-map-id'
  HOST: 'http://localhost:3000'
  HOSTNAME: 'localhost:3000'
  IMAGE_HOST: 'https://res.cloudinary.com/henetiriki/image/upload/v1664623206/insta'
  IMAGE_HOST_NAME: 'res.cloudinary.com'
  IMAGE_HOST_PATH: 'henetiriki/image/upload/v1664623206/insta'
  IMAGE_HOST_PROTOCOL: 'https'
  ISTAGRAM_IMAGE_IDS: 'BZ4QGdOn6SP,Bcg0AZwFwv6,B5zAuLqJTEg,CEbEP7XJafW'
  PROTOCOL: 'https'

jobs:
  # A documentation-only change takes a cheap path. Its own job because
  # `steps.*` does not cross job boundaries and both jobs below consume the
  # answer. Checkout only, no install, so it costs seconds. The exclusions are
  # CI's, not Vercel's, and the two lists deliberately differ — see the release
  # checklist.
  classify:
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.change.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Two commits, because the step below diffs HEAD against HEAD^.
          fetch-depth: 2

      - name: Classify the change
        id: change
        run: |
          if git diff --quiet HEAD^ HEAD -- . ':(exclude)docs' ':(exclude)*.md' ':(exclude).claude' ':(exclude).worktreeinclude'; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
            echo 'Documentation-only change: `prettier:check` and the Jest run ran, everything else was skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

  # Everything that runs against source. Keeps per-step gates rather than one
  # gate on the job, because `prettier:check`, the Jest run and the Codecov
  # upload all still run on a documentation-only change. See D-260815c.
  validate:
    name: Validate
    needs: classify
    permissions:
      contents: read
      # Codecov authenticates by short-lived OIDC, so no upload secret is stored.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check generated CSS variables
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn css-vars:check

      - name: Check generated PWA icons and splash images
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn icons:check

      - name: Lint
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn eslint:check

      - name: Type-check application
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn type-check

      - name: Type-check service worker
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn tsc --pretty --noEmit --project service-worker/tsconfig.json

      # Never gated, for the same reason prettier isn't: it exists specifically
      # to check docs, so a documentation-only change is exactly the case it
      # must not skip. Pure Node, no build inputs — a link either resolves or
      # it doesn't, regardless of what else changed in the diff.
      - name: Check documentation links
        run: yarn docs:check-links

      # Never gated: prettier covers the whole tree, so on a documentation-only
      # change it is the one check that applies to what changed.
      - name: Check formatting
        run: yarn prettier:check

      # Also never gated, though nothing under docs/ can affect it. Codecov must
      # post a status on every pull request for `codecov/patch` to be required —
      # a skipped upload leaves that check pending forever. Jest is the fast part
      # of the cheap path, so paying for it removes the edge case. See D-260815c.
      - name: Test with coverage
        run: yarn test:coverage

      # Skipped for fork pull requests, which GitHub issues no OIDC token to
      # whatever `id-token: write` says — `use_oidc` would have nothing to
      # authenticate with and `fail_ci_if_error` would make that a failed job.
      # The event-name half of the guard is load-bearing: the pull_request
      # context is null on a push to main, so the repository comparison alone
      # would stop uploading from the branch the coverage is about.
      - name: Upload coverage to Codecov
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          use_oidc: true

  # Everything that needs a production build, running concurrently with the job
  # above: nothing here consumes anything it produces. This job is exactly what
  # the cheap path skips, so it is one gate on the job rather than a gate per
  # step. A job skipped by an `if:` reports success and satisfies a required
  # check, which a `paths-ignore` filter would not — see D-260815c.
  build:
    name: Build & browser suite
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      # Belongs solely to this job, so the two do not contend for it.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('next.config.js', 'postcss.config.cjs', 'tsconfig.json', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'service-worker/**/*.ts', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-

      - name: Install dependencies
        run: yarn install --immutable

      # One build, because there is only one production configuration: the
      # service worker is generated whenever NODE_ENV is production, with no
      # flag to set. See D-260807a.
      - name: Build
        run: yarn build

      - name: Verify service worker output
        run: test -s public/sw.js

      # Keyed on the installed Playwright version, because that is what the
      # ~270 MB browser download actually tracks. A lockfile-wide key would
      # discard it on every weekly Dependabot bump. Install scripts are
      # disabled repository-wide (D-260811a), so the browser is fetched explicitly
      # here rather than by a postinstall hook.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          path: ~/.cache/ms-playwright

      # Runs on a cache hit too: --with-deps also installs system font and
      # library packages, which live outside the cached browser directory.
      - name: Install Playwright browser
        run: yarn test:e2e:install

      - name: Browser regression suite
        run: yarn test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
