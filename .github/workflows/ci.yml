name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hoisted to workflow level so both jobs share one copy — the build needs it,
# and so does Playwright's `webServer` (`yarn start`). Non-secret dummies only.
env:
  CUSTOM_APP_DOMAIN: 'example.test'
  GMAIL_APP_EMAIL: 'owner@example.test'
  GMAIL_APP_PASSWORD: 'test-app-password'
  GMAIL_SENDER_EMAIL: 'owner@example.test'
  GOOGLE_MAPS_API_KEY: 'test-google-maps-api-key'
  GOOGLE_MAPS_MAP_ID: 'test-google-maps-map-id'
  GOOGLE_MAPS_STATIC_MAP_ID: 'test-google-maps-static-map-id'
  HOST: 'http://localhost:3000'
  HOSTNAME: 'localhost:3000'
  IMAGE_HOST: 'https://res.cloudinary.com/henetiriki/image/upload/v1664623206/insta'
  IMAGE_HOST_NAME: 'res.cloudinary.com'
  IMAGE_HOST_PATH: 'henetiriki/image/upload/v1664623206/insta'
  IMAGE_HOST_PROTOCOL: 'https'
  ISTAGRAM_IMAGE_IDS: 'BZ4QGdOn6SP,Bcg0AZwFwv6,B5zAuLqJTEg,CEbEP7XJafW'
  PROTOCOL: 'https'

jobs:
  # Its own job because `steps.*` does not cross job boundaries and both jobs
  # below consume the answer — see docs/ci-and-deploys.md#pull-request.
  classify:
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.change.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Two commits, because the step below diffs HEAD against HEAD^.
          fetch-depth: 2

      # The exclusion list lives in the script, not here, so `yarn validate`
      # answers this the same way locally. No install runs before this, so
      # the script has no dependencies and needs none.
      - name: Classify the change
        id: change
        run: |
          verdict="$(node scripts/classify-change.mjs --base HEAD^ --explain)"
          echo "$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = 'docs_only=true' ]; then
            echo 'Documentation-only change: `docs:check-links`, `agent:check-config`, `prettier:check` and the Jest run with its Codecov upload ran, plus the branch-name check on a pull request. The classification skipped the generated-asset checks, lint, both type-checks and the build job.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # Everything that runs against source. Keeps per-step gates rather than one
  # gate on the job, because `prettier:check`, the Jest run and the Codecov
  # upload all still run on a documentation-only change.
  validate:
    name: Validate
    needs: classify
    permissions:
      contents: read
      # Codecov authenticates by short-lived OIDC, so no upload secret is stored.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # See docs/ci-and-deploys.md#pull-request. The ref goes through `env`,
      # not `${{ }}` interpolation into the `run:` body — a branch name is
      # attacker-controlled on a fork pull request, and that would be injection.
      - name: Check the branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-branch-name.mjs --ref "$HEAD_REF"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check generated CSS variables
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn css-vars:check

      - name: Check generated PWA icons and splash images
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn icons:check

      - name: Lint
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn eslint:check

      - name: Type-check application
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn type-check

      - name: Type-check service worker
        if: needs.classify.outputs.docs_only != 'true'
        run: yarn tsc --pretty --noEmit --project service-worker/tsconfig.json

      # Never gated, for the same reason prettier isn't: it exists specifically
      # to check docs, so a documentation-only change is exactly the case it
      # must not skip. Pure Node, no build inputs — a link either resolves or
      # it doesn't, regardless of what else changed in the diff.
      - name: Check documentation links
        run: yarn docs:check-links

      # Never gated, for the same reason as prettier above — see
      # docs/ci-and-deploys.md#pull-request.
      - name: Check agent configuration
        run: yarn agent:check-config

      # Never gated: prettier covers the whole tree, so on a documentation-only
      # change it is the one check that applies to what changed.
      - name: Check formatting
        run: yarn prettier:check

      # Also never gated, though nothing under docs/ can affect it. Codecov must
      # post a status on every pull request for `codecov/patch` to be required —
      # a skipped upload leaves that check pending forever. Jest is the fast part
      # of the cheap path, so paying for it removes the edge case.
      - name: Test with coverage
        run: yarn test:coverage

      # Skipped for fork pull requests (no OIDC token) — see
      # docs/ci-and-deploys.md#coverage. The event-name half of the guard is
      # load-bearing: `pull_request` context is null on a push to main.
      - name: Upload coverage to Codecov
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          use_oidc: true

  # Runs concurrently with Validate — see docs/ci-and-deploys.md#pull-request.
  build:
    name: Build & browser suite
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      # No restore-keys fallback: a prefix match could restore .next/cache from
      # a build with different public assets, and the image-optimisation cache
      # inside it trusts a restored entry without checking the source file.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('next.config.js', 'postcss.config.cjs', 'tsconfig.json', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'service-worker/**/*.ts', 'public/**') }}

      - name: Install dependencies
        run: yarn install --immutable

      # One build, because there is only one production configuration: the
      # service worker is generated whenever NODE_ENV is production, with no
      # flag to set.
      - name: Build
        run: yarn build

      - name: Verify service worker output
        run: test -s public/sw.js

      # Keyed on the Playwright version, not the lockfile, since that's what
      # the ~270 MB browser download tracks — a lockfile key would discard it
      # on every weekly Dependabot bump. Fetched explicitly: install scripts
      # are disabled repository-wide, so no postinstall hook would do it.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          path: ~/.cache/ms-playwright

      # Runs on a cache hit too: --with-deps also installs system font and
      # library packages, which live outside the cached browser directory.
      - name: Install Playwright browser
        run: yarn test:e2e:install

      - name: Browser regression suite
        run: yarn test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
