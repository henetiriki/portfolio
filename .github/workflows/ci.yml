name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate & build
    runs-on: ubuntu-latest
    # Next production builds do not load .env.test. These non-secret dummy
    # values keep next.config.js valid without exposing deployment credentials.
    env:
      CUSTOM_APP_DOMAIN: 'example.test'
      GMAIL_APP_EMAIL: 'owner@example.test'
      GMAIL_APP_PASSWORD: 'test-app-password'
      GMAIL_SENDER_EMAIL: 'owner@example.test'
      GOOGLE_MAPS_API_KEY: 'test-google-maps-api-key'
      GOOGLE_MAPS_MAP_ID: 'test-google-maps-map-id'
      HOST: 'http://localhost:3000'
      HOSTNAME: 'localhost:3000'
      IMAGE_HOST: 'http://localhost:3000/images'
      IMAGE_HOST_NAME: 'localhost'
      IMAGE_HOST_PATH: 'images'
      IMAGE_HOST_PROTOCOL: 'http'
      ISTAGRAM_IMAGE_IDS: 'test-img-id'
      PROTOCOL: 'https'
      WITH_PWA: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('next.config.js', 'postcss.config.cjs', 'tsconfig.json', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'service-worker/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check generated CSS variables
        run: yarn css-vars:check

      - name: Lint
        run: yarn eslint:check

      - name: Type-check application
        run: yarn type-check

      - name: Type-check service worker
        run: yarn tsc --pretty --noEmit --project service-worker/tsconfig.json

      - name: Check formatting
        run: yarn prettier:check

      - name: Test with coverage
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          use_oidc: true

      # Both build paths are exercised because they use the same bundler but
      # different plugin chains (see D004). The default path is what local
      # `yarn build` runs; the PWA path is what production deploys.
      - name: Build default (no service worker)
        run: yarn build

      - name: Verify no service worker is emitted without WITH_PWA
        run: test ! -e public/sw.js

      - name: Build production PWA
        env:
          WITH_PWA: 'true'
        run: yarn build

      - name: Verify service worker output
        run: test -s public/sw.js
